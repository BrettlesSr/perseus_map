name: Sync Google Sheet

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch: # "Run workflow" button = sync now

permissions:
  contents: write

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # fails (and GitHub emails the repo owner) if the sheet has invalid rows
      - run: npm run sync-sheet
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          SHEET_GIDS: ${{ vars.SHEET_GIDS }}
      - id: commit
        run: |
          if git diff --quiet -- public/data/game.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/game.json
          git commit -m "Sync game data from Google Sheet"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
